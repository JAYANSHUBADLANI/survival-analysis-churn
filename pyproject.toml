[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-analysis-churn"
version = "1.0.0"
description = "Survival analysis for customer churn, implemented from scratch: Kaplan-Meier, log-rank, Cox proportional hazards, and PH diagnostics, validated on simulated and real data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jayanshu Badlani", email = "badlanijayanshu@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
